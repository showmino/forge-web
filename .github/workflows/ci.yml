name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "forge.yaml"
  pull_request:
    paths-ignore:
      - "forge.yaml"

permissions:
  contents: read

# The tests run once, on the pull request. A merge to `main` builds the image
# without running them again: `main` only changes through pull requests, and
# a branch is merged only when it contains the current `main` and `test`
# passed (AGENTS.md), so the merge commit is the tree that was tested. The
# image build still compiles and type-checks the app. Nothing deploys it: the
# forge chart runs the dashboard, at the version its values name (release.yml).
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The generated API client is up to date
        run: npm run generate && git diff --exit-code -- gen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # No API address is built in: Forge runs the image with FORGE_API_URL
        # (forge.yaml run.env), so the same image serves any Forge.
        run: |
          image=ghcr.io/showmino/forge-web:${GITHUB_SHA::7}
          docker build -t "$image" .
          docker push "$image"
