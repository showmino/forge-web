name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The tests run once, on the pull request. A merge to `main` builds the image
# and deploys it without running them again: `main` only changes through pull
# requests, and a branch is merged only when it contains the current `main`
# and `test` passed (AGENTS.md), so the merge commit is the tree that was
# tested. The image build still compiles and type-checks the app.
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The generated API client is up to date
        run: npm run generate && git diff --exit-code -- gen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    if: github.event_name == 'push'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        env:
          # The address the pages call the Forge API at, from a browser. The
          # dashboard is served over HTTPS, so this must be the API's HTTPS
          # name; FORGE_API_URL (what CI itself uses, on the LAN) is the
          # fallback for a dashboard served over plain HTTP.
          FORGE_API_URL: ${{ vars.FORGE_WEB_API_URL || vars.FORGE_API_URL }}
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "::error::set the variable FORGE_WEB_API_URL (or the organization variable FORGE_API_URL) to the Forge API: the dashboard's pages call it"
            exit 1
          fi
          image=ghcr.io/showmino/forge-web:${GITHUB_SHA::7}
          docker build --build-arg NEXT_PUBLIC_FORGE_API_URL="$FORGE_API_URL" -t "$image" .
          docker push "$image"

  # Deploys main to staging through Forge. Runs on the LAN runners, which can
  # reach the Forge API, and logs in with this job's GitHub OIDC token: the
  # token only lets it deploy this service to staging, at this commit.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    runs-on: self-hosted
    timeout-minutes: 20
    concurrency:
      group: forge-deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      FORGE_API_URL: ${{ vars.FORGE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the forge CLI from the Forge API
        run: |
          if [ -z "$FORGE_API_URL" ]; then
            echo "::error::set the organization variable FORGE_API_URL to the Forge API (for example http://forge.10.150.1.221.nip.io)"
            exit 1
          fi
          case $(uname -m) in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "::error::unsupported runner architecture $(uname -m)"; exit 1 ;;
          esac
          url="$FORGE_API_URL/cli/forge-linux-$arch"
          echo "downloading $url"
          curl -fsS --retry 3 --max-time 120 -o "$RUNNER_TEMP/forge" "$url"
          chmod +x "$RUNNER_TEMP/forge"
          "$RUNNER_TEMP/forge" version
      - name: Deploy to staging
        run: '"$RUNNER_TEMP/forge" deploy start --env staging'
