name: Copilot setup steps

# What GitHub's coding agent has before it starts work in this repo: Node and
# the dependencies of the lockfile, so that lint, typecheck, test and build
# run at once. The job must be called copilot-setup-steps. It also runs when
# this file changes, so a broken setup is seen in review.
on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
