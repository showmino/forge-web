name: release

# A release is a tag vX.Y.Z pushed on a commit of main. This adds that
# version to the image CI built for the commit, so
# ghcr.io/showmino/forge-web:v0.3.1 is the image a Forge runs: the forge
# chart's web.image.tag names it (its default, and showmino's values in
# showmino/kubernetes). Tags up to v0.1.35 were cut by Forge itself, while
# the dashboard was deployed as a Forge service.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image with the version
        run: |
          image=ghcr.io/showmino/forge-web
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image:${GITHUB_SHA::7}"
