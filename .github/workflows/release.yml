name: release

# Every tag vX.Y.Z or vX.Y.Z-rc.N gets its version on the image CI built for
# its commit, so ghcr.io/showmino/forge-web:v0.3.1 is the image a Forge runs.
# Forge cuts a release candidate (v0.3.1-rc.2) on each staging deploy; a
# release (v0.3.1) is a tag pushed by hand once staging looks right, and the
# forge chart's web.image.tag names it (its default, and showmino's values in
# showmino/kubernetes).
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image with the version
        run: |
          image=ghcr.io/showmino/forge-web
          docker buildx imagetools create --tag "$image:$GITHUB_REF_NAME" "$image:${GITHUB_SHA::7}"
