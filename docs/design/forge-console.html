<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Forge Console</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312181d'/%3E%3Crect x='6' y='6.5' width='20' height='5.5' rx='1.2' fill='%23e5e8ec'/%3E%3Crect x='6' y='13.25' width='13' height='5.5' rx='1.2' fill='%23e5e8ec'/%3E%3Crect x='6' y='20' width='7' height='5.5' rx='1.2' fill='%23d2520f'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Forge design language v0.1
   Layout: dark iron rail + light work surface; every screen = title, one primary action, its CLI equivalent, then summary before detail.
   Color: iron neutrals (hue 250, low chroma) · ember for the one primary action and work in progress · status colors carry meaning only.
   Type: Archivo (expanded) for titles and big numbers · IBM Plex Sans for UI · IBM Plex Mono for names, refs, commands. */
:root{
  --bg:oklch(0.975 0.004 250);
  --surface:oklch(1 0 0);
  --surface-2:oklch(0.965 0.005 250);
  --line:oklch(0.905 0.007 250);
  --line-strong:oklch(0.82 0.01 250);
  --fg:oklch(0.22 0.014 250);
  --fg-2:oklch(0.42 0.014 250);
  --fg-3:oklch(0.52 0.012 250);
  --ember:oklch(0.6 0.175 42);
  --ember-hot:oklch(0.7 0.17 55);
  --ember-on:oklch(0.99 0.01 60);
  --ember-soft:oklch(0.95 0.035 52);
  --ember-ink:oklch(0.47 0.15 40);
  --ok-bg:oklch(0.95 0.045 155);  --ok-fg:oklch(0.42 0.11 155);  --ok-dot:oklch(0.62 0.15 155);
  --warn-bg:oklch(0.95 0.06 85);  --warn-fg:oklch(0.45 0.1 70);  --warn-dot:oklch(0.75 0.15 75);
  --bad-bg:oklch(0.95 0.035 25);  --bad-fg:oklch(0.48 0.17 25);  --bad-dot:oklch(0.6 0.2 25);
  --info-bg:oklch(0.95 0.03 245); --info-fg:oklch(0.45 0.12 250); --info-dot:oklch(0.6 0.14 250);
  --rail-bg:oklch(0.205 0.014 250);
  --rail-fg:oklch(0.93 0.006 250);
  --rail-fg-2:oklch(0.72 0.012 250);
  --rail-line:oklch(0.3 0.014 250);
  --rail-active:oklch(0.27 0.016 250);
  --scrim:oklch(0.2 0.02 250 / 0.45);
  --env-staging:oklch(0.58 0.16 300);
  --env-production:oklch(0.56 0.15 250);
  --env-preview:oklch(0.62 0.14 55);
  --shadow-1:0 1px 2px oklch(0.2 0.02 250 / 0.06),0 0 0 1px oklch(0.2 0.02 250 / 0.03);
  --shadow-3:0 12px 32px -8px oklch(0.2 0.02 250 / 0.22),0 0 0 1px oklch(0.2 0.02 250 / 0.06);
  --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:4px; --r-md:6px; --r-lg:10px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:oklch(0.17 0.01 250); --surface:oklch(0.205 0.012 250); --surface-2:oklch(0.235 0.012 250);
  --line:oklch(0.29 0.012 250); --line-strong:oklch(0.37 0.014 250);
  --fg:oklch(0.95 0.005 250); --fg-2:oklch(0.78 0.01 250); --fg-3:oklch(0.68 0.012 250);
  --ember:oklch(0.72 0.16 48); --ember-hot:oklch(0.8 0.15 62); --ember-on:oklch(0.2 0.03 40);
  --ember-soft:oklch(0.3 0.06 45); --ember-ink:oklch(0.84 0.11 58);
  --ok-bg:oklch(0.3 0.05 155); --ok-fg:oklch(0.86 0.1 155); --ok-dot:oklch(0.72 0.15 155);
  --warn-bg:oklch(0.32 0.05 80); --warn-fg:oklch(0.88 0.1 85); --warn-dot:oklch(0.8 0.14 80);
  --bad-bg:oklch(0.31 0.07 25); --bad-fg:oklch(0.86 0.09 25); --bad-dot:oklch(0.68 0.19 25);
  --info-bg:oklch(0.3 0.05 250); --info-fg:oklch(0.86 0.07 250); --info-dot:oklch(0.7 0.13 250);
  --rail-bg:oklch(0.14 0.01 250); --rail-fg:oklch(0.93 0.006 250); --rail-fg-2:oklch(0.7 0.012 250);
  --rail-line:oklch(0.24 0.012 250); --rail-active:oklch(0.22 0.014 250);
  --scrim:oklch(0.05 0.01 250 / 0.6);
  --env-staging:oklch(0.74 0.13 300); --env-production:oklch(0.72 0.12 250); --env-preview:oklch(0.76 0.13 60);
  --shadow-1:inset 0 1px 0 oklch(1 0 0 / 0.04),0 0 0 1px oklch(0 0 0 / 0.2);
  --shadow-3:inset 0 1px 0 oklch(1 0 0 / 0.06),0 0 0 1px oklch(0 0 0 / 0.3),0 16px 40px -8px oklch(0 0 0 / 0.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:oklch(0.17 0.01 250); --surface:oklch(0.205 0.012 250); --surface-2:oklch(0.235 0.012 250);
  --line:oklch(0.29 0.012 250); --line-strong:oklch(0.37 0.014 250);
  --fg:oklch(0.95 0.005 250); --fg-2:oklch(0.78 0.01 250); --fg-3:oklch(0.68 0.012 250);
  --ember:oklch(0.72 0.16 48); --ember-hot:oklch(0.8 0.15 62); --ember-on:oklch(0.2 0.03 40);
  --ember-soft:oklch(0.3 0.06 45); --ember-ink:oklch(0.84 0.11 58);
  --ok-bg:oklch(0.3 0.05 155); --ok-fg:oklch(0.86 0.1 155); --ok-dot:oklch(0.72 0.15 155);
  --warn-bg:oklch(0.32 0.05 80); --warn-fg:oklch(0.88 0.1 85); --warn-dot:oklch(0.8 0.14 80);
  --bad-bg:oklch(0.31 0.07 25); --bad-fg:oklch(0.86 0.09 25); --bad-dot:oklch(0.68 0.19 25);
  --info-bg:oklch(0.3 0.05 250); --info-fg:oklch(0.86 0.07 250); --info-dot:oklch(0.7 0.13 250);
  --rail-bg:oklch(0.14 0.01 250); --rail-fg:oklch(0.93 0.006 250); --rail-fg-2:oklch(0.7 0.012 250);
  --rail-line:oklch(0.24 0.012 250); --rail-active:oklch(0.22 0.014 250);
  --scrim:oklch(0.05 0.01 250 / 0.6);
  --env-staging:oklch(0.74 0.13 300); --env-production:oklch(0.72 0.12 250); --env-preview:oklch(0.76 0.13 60);
  --shadow-1:inset 0 1px 0 oklch(1 0 0 / 0.04),0 0 0 1px oklch(0 0 0 / 0.2);
  --shadow-3:inset 0 1px 0 oklch(1 0 0 / 0.06),0 0 0 1px oklch(0 0 0 / 0.3),0 16px 40px -8px oklch(0 0 0 / 0.6);
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:var(--r-sm)}
.mono{font-family:var(--font-mono);font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)}
.faint{color:var(--fg-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail-bg);color:var(--rail-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:var(--s4) var(--s3);gap:var(--s4)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px;text-decoration:none}
.brand-word{font-family:var(--font-display);font-stretch:118%;font-weight:750;font-size:19px;letter-spacing:.01em}
.brand-ver{font-family:var(--font-mono);font-size:11px;color:var(--rail-fg-2);margin-left:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--rail-fg-2);padding:var(--s3) 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-md);color:var(--rail-fg-2);text-decoration:none;font-weight:500;position:relative}
.nav a svg{flex:none;opacity:.9}
.nav a .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--rail-fg-2)}
.nav a[aria-current="page"]{background:var(--rail-active);color:var(--rail-fg)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ember)}
@media (hover:hover) and (pointer:fine){.nav a:hover:not([aria-current="page"]){color:var(--rail-fg);background:color-mix(in oklab,var(--rail-active) 60%,transparent)}}
.rail-foot{margin-top:auto;border-top:1px solid var(--rail-line);padding-top:var(--s3);display:flex;align-items:center;gap:10px;padding-inline:8px}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:600;background:var(--ember-soft);color:var(--ember-ink);flex:none}
.rail .avatar{background:var(--rail-active);color:var(--rail-fg)}
.who{font-size:13px;line-height:1.25}
.who small{display:block;color:var(--rail-fg-2);font-size:11.5px}

.rail-toggle{display:flex;align-items:center;gap:10px;padding:7px 10px;border:0;border-radius:var(--r-md);background:transparent;color:var(--rail-fg-2);font:inherit;font-weight:500;cursor:pointer;margin-top:auto}
.rail-toggle .chev{transform:rotate(180deg);transform-origin:14.5px 12px}
@media (hover:hover) and (pointer:fine){.rail-toggle:hover{background:var(--rail-active);color:var(--rail-fg)}}
.rail-toggle+.rail-foot{margin-top:0}
@media (min-width:861px){
  .app{transition:grid-template-columns .18s ease}
  .app.rail-min{grid-template-columns:64px minmax(0,1fr)}
  .rail-min .rail{padding-inline:10px;align-items:center}
  .rail-min .brand{padding:2px 0 6px}
  .rail-min .brand-word,.rail-min .brand-ver,.rail-min .nav-t,.rail-min .who,.rail-min .role{display:none}
  .rail-min .nav{width:100%;align-items:center}
  .rail-min .nav-label{font-size:0;padding:0;height:1px;width:24px;background:var(--rail-line);margin:var(--s2) 0}
  .rail-min .nav a{width:40px;height:36px;padding:0;justify-content:center}
  .rail-min .nav a[aria-current="page"]::before{left:-10px}
  .rail-min .nav a .count{display:none}
  .rail-min .nav a .count#nav-apr:not(:empty),.rail-min .nav a .count#nav-run:not(:empty){display:grid;place-items:center;position:absolute;top:2px;right:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--ember);color:var(--ember-on);font-size:9.5px;line-height:1;margin:0}
  .rail-min .nav a[data-tip]:is(:hover,:focus-visible)::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:var(--rail-bg);color:var(--rail-fg);border:1px solid var(--rail-line);padding:4px 8px;border-radius:var(--r-sm);font-size:12.5px;white-space:nowrap;z-index:50;pointer-events:none;box-shadow:var(--shadow-2,0 4px 12px rgb(0 0 0/.2))}
  .rail-min .rail-toggle{width:40px;height:36px;padding:0;justify-content:center}
  .rail-min .rail-toggle .chev{transform:none}
  .rail-min .rail-foot{padding-inline:0;justify-content:center;border-top:1px solid var(--rail-line);width:100%}
}
@media (max-width:860px){.rail-toggle{display:none}.rail-toggle+.rail-foot{margin-top:auto}}
.rail-scrim{display:none;position:fixed;inset:0;background:var(--scrim);z-index:35}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:var(--s3);padding:10px var(--s6);background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.icon-btn.menu-btn{display:none}
.ctx{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:5px 10px;font-size:13px;cursor:pointer}
.ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--ok-dot)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:6px 10px;color:var(--fg-3);cursor:text;text-align:left}
.search>span:not(.kbd){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.search{min-width:0}
.kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:var(--r-sm);padding:0 5px;color:var(--fg-2);background:var(--surface-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.content{padding:var(--s6) var(--s6) var(--s7);max-width:1320px;width:100%;display:flex;flex-direction:column;gap:var(--s6)}

/* ---------- Page header ---------- */
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s4) var(--s5)}
.ph-text{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:6px}
.crumbs{font-size:12.5px;color:var(--fg-3);display:flex;gap:6px;align-items:center}
.crumbs a{text-decoration:none;color:var(--fg-2)}
h1{font-family:var(--font-display);font-stretch:112%;font-weight:720;font-size:30px;line-height:1.1;letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-stretch:108%;font-weight:680;font-size:17px;line-height:1.25;margin:0}
h3{font-size:14px;font-weight:600;margin:0}
.lede{color:var(--fg-2);margin:0;max-width:62ch}
.ph-actions{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}

/* CLI equivalent: the Forge signature. Every screen names its command. */
.cli{display:inline-flex;align-items:center;gap:10px;max-width:100%;font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:5px 6px 5px 10px;color:var(--fg-2);align-self:flex-start}
.cli code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cli code b{color:var(--ember-ink);font-weight:500}
.cli .prompt{color:var(--fg-3);user-select:none}
.cli button{border:0;background:transparent;color:var(--fg-3);cursor:pointer;padding:2px 4px;border-radius:var(--r-sm);font-size:11.5px;font-family:var(--font-ui)}
@media (hover:hover) and (pointer:fine){.cli button:hover{color:var(--fg);background:var(--surface)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-md);padding:7px 13px;font-weight:500;font-size:13.5px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);cursor:pointer;text-decoration:none;line-height:1.3;white-space:nowrap}
.btn-primary{background:var(--ember);border-color:var(--ember);color:var(--ember-on);box-shadow:inset 0 1px 0 oklch(1 0 0 / 0.18),0 1px 2px oklch(0.4 0.12 40 / 0.3)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn-danger{background:var(--bad-dot);border-color:var(--bad-dot);color:oklch(0.99 0 0)}
.btn-sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--fg-2);cursor:pointer}
@media (hover:hover) and (pointer:fine){
  .btn:hover:not(:disabled){border-color:var(--fg-3)}
  .btn-primary:hover:not(:disabled){background:color-mix(in oklab,var(--ember) 88%,var(--fg));border-color:transparent}
  .btn-ghost:hover:not(:disabled){background:var(--surface-2);color:var(--fg);border-color:transparent}
  .icon-btn:hover{background:var(--surface-2);color:var(--fg)}
}

/* ---------- Status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:1px 8px 1px 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)} .pill.ok::before{background:var(--ok-dot)}
.pill.warn{background:var(--warn-bg);color:var(--warn-fg)} .pill.warn::before{background:var(--warn-dot)}
.pill.bad{background:var(--bad-bg);color:var(--bad-fg)} .pill.bad::before{background:var(--bad-dot)}
.pill.info{background:var(--info-bg);color:var(--info-fg)} .pill.info::before{background:var(--info-dot)}
.pill.run{background:var(--ember-soft);color:var(--ember-ink)} .pill.run::before{background:var(--ember);animation:pulse 1.4s ease-in-out infinite}
.pill.neutral{background:var(--surface-2);color:var(--fg-2);box-shadow:inset 0 0 0 1px var(--line)} .pill.neutral::before{background:var(--fg-3)}
.tag{display:inline-block;font-family:var(--font-mono);font-size:11.5px;padding:0 6px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--fg-2);white-space:nowrap}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);min-width:0}
.panel-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s4) var(--s3)}
.panel-h .btn{margin-left:auto}
.panel-b{padding:0 var(--s4) var(--s4)}
.panel>.panel-b:first-child{padding-top:var(--s4)}
.section{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.section-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.section-h a{margin-left:auto;font-size:13px;color:var(--fg-2)}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:var(--s5)}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--s4)}

/* Stats strip: one quiet row, numbers lead labels */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.stat{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat-v{font-family:var(--font-display);font-stretch:112%;font-weight:700;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat-v small{font-size:15px;color:var(--fg-3);font-weight:600}
.stat-l{color:var(--fg-2);font-size:13px}
.stat-n{font-size:12px;color:var(--fg-3)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--fg-3);font-size:12px;padding:9px var(--s4);border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:11px var(--s4);border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.link{cursor:pointer}
@media (hover:hover) and (pointer:fine){tbody tr.link:hover td{background:var(--surface-2)}}
.cell-name{display:flex;flex-direction:column;gap:1px;min-width:0}
.cell-name a{font-family:var(--font-mono);font-weight:500;text-decoration:none;font-size:13.5px}
.cell-name span{color:var(--fg-3);font-size:12.5px}

/* ---------- Toolbar / chips ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--fg-2)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--font-mono);font-size:11.5px;margin-left:4px;opacity:.8}
@media (hover:hover) and (pointer:fine){.chip:hover:not([aria-pressed="true"]){border-color:var(--fg-3);color:var(--fg)}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:500}
.field .hint{font-size:12px;color:var(--fg-3)}
.input,.select{width:100%;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-md);padding:7px 10px;font-size:13.5px}
.input:focus,.select:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px color-mix(in oklab,var(--ember) 25%,transparent)}
.input.mono{font-family:var(--font-mono)}
.filter{max-width:260px}

/* ---------- The forge line: deploy pipeline ---------- */
.line{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.seg{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg-bar{height:8px;border-radius:2px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.seg.done .seg-bar{background:var(--fg-2);box-shadow:none}
.seg.active .seg-bar{background:linear-gradient(90deg,var(--ember),var(--ember-hot),var(--ember));background-size:200% 100%;animation:heat 1.6s linear infinite;box-shadow:0 0 0 3px color-mix(in oklab,var(--ember) 18%,transparent)}
.seg.fail .seg-bar{background:var(--bad-dot);box-shadow:none}
.seg-l{font-size:12px;color:var(--fg-3);display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.seg.active .seg-l{color:var(--ember-ink);font-weight:500}
.seg.fail .seg-l{color:var(--bad-fg);font-weight:500}
.seg.done .seg-l{color:var(--fg-2)}
@keyframes heat{to{background-position:-200% 0}}
.mini{display:inline-grid;grid-template-columns:repeat(5,14px);gap:2px;vertical-align:middle}
.mini i{height:6px;border-radius:1px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.mini i.done{background:var(--fg-2);box-shadow:none}
.mini i.active{background:var(--ember);box-shadow:none}
.mini i.fail{background:var(--bad-dot);box-shadow:none}

.flight{display:flex;flex-direction:column;gap:var(--s4);padding:var(--s5)}
.flight-top{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4)}
.flight-title{font-family:var(--font-mono);font-size:16px;font-weight:600}
.flight-meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);font-size:13px;color:var(--fg-2)}
.flight-log{font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 12px;color:var(--fg-2);line-height:1.7;overflow-x:auto;white-space:pre}
.flight-log b{color:var(--ember-ink);font-weight:500}
.flight-log em{color:var(--ok-fg);font-style:normal}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:11px var(--s4);border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-t{font-weight:500;min-width:0}
.row-t .mono{font-weight:500}
.row-s{font-size:12.5px;color:var(--fg-3);margin-top:1px}
.sev{width:3px;align-self:stretch;border-radius:2px;background:var(--line-strong)}
.sev.bad{background:var(--bad-dot)} .sev.warn{background:var(--warn-dot)} .sev.info{background:var(--info-dot)}

/* ---------- Service detail ---------- */
.tabs{display:flex;gap:var(--s5);border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:10px 0;font-weight:500;color:var(--fg-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ember)}
@media (hover:hover) and (pointer:fine){.tab:hover:not([aria-selected="true"]){color:var(--fg)}}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;position:relative}
.rung{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.rung+.rung{border-left:1px dashed var(--line-strong)}
.rung-env{font-size:12.5px;color:var(--fg-3);display:flex;align-items:center;gap:8px}
.rung-ver{font-family:var(--font-mono);font-size:22px;font-weight:600;letter-spacing:-.01em}
.rung-ver.ahead{color:var(--ember-ink)}
.rung-s{font-size:12.5px;color:var(--fg-2)}
.rung .btn{align-self:flex-start;margin-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px var(--s4);font-size:13.5px;margin:0}
.kv dt{color:var(--fg-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:center;font-size:13.5px}
.tick{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;flex:none}
.tick.y{background:var(--ok-bg);color:var(--ok-fg)} .tick.n{background:var(--warn-bg);color:var(--warn-fg)}
.score{display:flex;gap:3px}
.score i{width:16px;height:6px;border-radius:1px;background:var(--line)}
.score i.on{background:var(--ok-dot)}
.deps{display:flex;flex-wrap:wrap;gap:var(--s2)}
.dep{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-md);padding:5px 10px;font-family:var(--font-mono);font-size:12.5px;text-decoration:none;background:var(--surface)}
.dep .k{font-family:var(--font-ui);font-size:11px;color:var(--fg-3)}
.side{display:flex;flex-direction:column;gap:var(--s5)}

/* ---------- Environments ---------- */
.env-card{padding:var(--s4) var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.env-top{display:flex;align-items:center;gap:var(--s2)}
.env-name{font-family:var(--font-mono);font-weight:600;font-size:15px}
.env-top .pill{margin-left:auto}
.env-facts{display:flex;gap:var(--s5);font-size:12.5px;color:var(--fg-2);flex-wrap:wrap}
.env-facts b{display:block;font-family:var(--font-display);font-stretch:110%;font-size:20px;font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums}
.ttl{display:flex;flex-direction:column;gap:4px;min-width:150px}
.ttl-bar{height:6px;border-radius:3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.ttl-bar i{display:block;height:100%;background:var(--fg-3);border-radius:3px}
.ttl-bar i.low{background:var(--warn-dot)}
.ttl span{font-size:12px;color:var(--fg-2)}

/* ---------- Templates ---------- */
.tpl{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3)}
.tpl-top{display:flex;align-items:center;gap:var(--s3)}
.tpl-mark{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--fg-2)}
.tpl-name{font-family:var(--font-mono);font-weight:600;font-size:15px}
.tpl p{margin:0;color:var(--fg-2);font-size:13.5px}
.baked{display:flex;flex-wrap:wrap;gap:6px}
.tpl-foot{display:flex;align-items:center;gap:var(--s3);margin-top:auto;padding-top:var(--s2);font-size:12.5px;color:var(--fg-3)}
.tpl-foot .btn{margin-left:auto}

/* ---------- Drawer / dialog / palette ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex}
.drawer{margin-left:auto;width:min(480px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow-3);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s5) var(--s5) var(--s4);border-bottom:1px solid var(--line)}
.drawer-h .icon-btn{margin-left:auto}
.drawer-b{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4);overflow-y:auto;flex:1}
.drawer-f{padding:var(--s4) var(--s5) calc(var(--s4) + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:var(--s2);justify-content:flex-end}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:3px;accent-color:var(--ember)}
.preview-cli{font-family:var(--font-mono);font-size:12.5px;background:var(--rail-bg);color:var(--rail-fg);border-radius:var(--r-md);padding:12px 14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.preview-cli .p{color:var(--rail-fg-2)}
.preview-cli .f{color:oklch(0.8 0.13 60)}
.dialog{margin:auto;width:min(440px,calc(100% - 32px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-3);padding:var(--s5);display:flex;flex-direction:column;gap:var(--s4)}
.dialog p{margin:0;color:var(--fg-2)}
.dialog-f{display:flex;gap:var(--s2);justify-content:flex-end}
.palette{margin:12vh auto auto;width:min(560px,calc(100% - 32px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-3);overflow:hidden;align-self:flex-start}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:15px;background:transparent;outline:none}
.palette ul{list-style:none;margin:0;padding:6px;max-height:320px;overflow-y:auto}
.palette li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);cursor:pointer}
.palette li[aria-selected="true"]{background:var(--surface-2)}
.palette li .k{margin-left:auto;font-size:12px;color:var(--fg-3)}
.palette .empty{padding:14px 16px;color:var(--fg-3)}
.toast{position:fixed;right:var(--s5);bottom:calc(var(--s5) + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-3);font-size:13.5px;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}
.toast code{font-family:var(--font-mono);font-size:12.5px;opacity:.85}

/* ---------- Environments, lifecycle, addresses ---------- */
.envchip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:12.5px;padding:1px 8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);white-space:nowrap;color:var(--fg);background:var(--surface)}
.envchip::before{content:"";width:8px;height:8px;border-radius:1px;background:var(--env-preview)}
.envchip.staging::before{background:var(--env-staging)}
.envchip.production::before{background:var(--env-production)}
.life{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;white-space:nowrap;color:var(--fg-2)}
.life::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid var(--fg-3)}
.life.production::before{background:var(--fg-2);border-color:var(--fg-2)}
.life.experimental::before{border-style:dashed;border-color:var(--ember)}
.life.deprecated{text-decoration:line-through;text-decoration-color:var(--fg-3)}
.addr{font-family:var(--font-mono);font-size:12.5px;color:var(--info-fg);text-decoration:none;white-space:nowrap}
@media (hover:hover) and (pointer:fine){.addr:hover{text-decoration:underline}}
.mono.ahead{color:var(--ember-ink);font-weight:600}
.cell-name .envchip{align-self:flex-start}
.empty-note{padding:var(--s5);text-align:center;color:var(--fg-2);font-size:13.5px}
.env-pair{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.role{font-size:11px;font-weight:600;padding:1px 6px;border-radius:var(--r-sm);background:var(--rail-active);color:var(--rail-fg);margin-left:auto}

/* ---------- Governance ---------- */
tr.group td{background:var(--surface-2);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3);padding:6px var(--s4)}
.seg-ctl{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.seg-ctl button{border:0;background:transparent;padding:4px 10px;font-size:12.5px;color:var(--fg-2);cursor:pointer}
.seg-ctl button+button{border-left:1px solid var(--line)}
.seg-ctl button[aria-pressed="true"]{background:var(--fg);color:var(--bg);font-weight:500}
@media (hover:hover) and (pointer:fine){.seg-ctl button:hover:not([aria-pressed="true"]){background:var(--surface-2);color:var(--fg)}}
.issue{font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
.issue.bad{color:var(--bad-fg)} .issue.warn{color:var(--warn-fg)}
@media (hover:hover) and (pointer:fine){.issue:hover{text-decoration:underline}}
.link-btn{border:0;background:none;padding:0;font:inherit;font-family:var(--font-mono);font-size:13.5px;font-weight:500;color:var(--fg);cursor:pointer}
@media (hover:hover) and (pointer:fine){.link-btn:hover{text-decoration:underline}}
.row .ph-actions{flex-wrap:nowrap}
@media (max-width:560px){.row:has(.ph-actions){grid-template-columns:auto minmax(0,1fr)}.row .ph-actions{grid-column:2}}

/* ---------- Service settings ---------- */
.btn-icon{padding:7px 9px}
.btn-icon[aria-pressed="true"]{background:var(--surface-2);border-color:var(--fg-3)}
.settings{display:flex;flex-direction:column;gap:var(--s5);max-width:720px}
.settings-form{display:flex;flex-direction:column;gap:var(--s4)}
.settings-form .input[readonly]{background:var(--surface-2);color:var(--fg-2)}
.panel.danger{border-color:color-mix(in oklab,var(--bad-dot) 45%,var(--line))}
.panel.danger h2{color:var(--bad-fg)}
.danger-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3) var(--s5)}
.danger-row>div{flex:1 1 280px;min-width:0}
.danger-row b{font-weight:600}
.danger-row+.danger-row{border-top:1px solid var(--line);padding-top:var(--s4);margin-top:var(--s4)}
.dialog{max-height:calc(100% - 32px);overflow-y:auto}
.danger-row p{margin:2px 0 0;color:var(--fg-2);font-size:13.5px}

.ext{display:inline-flex;align-items:center;gap:5px;color:var(--info-fg);text-decoration:none;font-size:13px;white-space:nowrap}
.ext .mono{font-size:12.5px}
@media (hover:hover) and (pointer:fine){.ext:hover{text-decoration:underline}}

/* ---------- Template inputs ---------- */
.tpl .tpl-inputs{margin:0;font-size:12.5px;color:var(--fg-2)}
.params{border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s4);margin:0;display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.params legend{padding:0 6px;margin-left:-6px;font-size:13px;font-weight:600}
.params .req{margin-left:8px;font-size:11px;font-weight:500;color:var(--fg-3);letter-spacing:.02em}
.params-b{display:flex;flex-direction:column;gap:var(--s4);padding-top:var(--s3)}
.opt-params summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--fg-2)}
.field-err{font-size:12px;color:var(--bad-fg)}
.field-err:empty{display:none}
.input[aria-invalid="true"]{border-color:var(--bad-dot)}

/* ---------- Overview ---------- */
.ov-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ov-cell{display:flex;flex-direction:column;gap:2px;padding:var(--s4) var(--s5) var(--s4) 0;min-width:0}
.ov-cell+.ov-cell{padding-left:var(--s5);border-left:1px solid var(--line)}
.ov-k{font-size:12.5px;color:var(--fg-3)}
.ov-v{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-stretch:112%;font-weight:700;font-size:24px;line-height:1.2}
.ov-v small{font-family:var(--font-ui);font-stretch:100%;font-weight:400;font-size:13px;color:var(--fg-2)}
.ov-n{font-size:12.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-n a{color:inherit}
.ov-dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line-strong)}
.ov-dot.ok{background:var(--ok-dot)} .ov-dot.warn{background:var(--warn-dot)} .ov-dot.bad{background:var(--bad-dot);border-radius:2px} .ov-dot.run{background:var(--ember);box-shadow:0 0 0 3px color-mix(in oklab,var(--ember) 25%,transparent)}
.ov-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s7,48px)}
.ov-list{display:flex;flex-direction:column}
.ov-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s3);align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.ov-item:last-child{border-bottom:1px solid var(--line)}
.ov-item>.ov-dot{align-self:start;margin-top:7px}
.ov-item-b{min-width:0;font-size:13.5px}
.ov-item-b .mono{font-size:13px;font-weight:500}
.ov-item-s{font-size:12.5px;color:var(--fg-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-item-a{display:flex;gap:6px;align-items:center}
.ov-state{font-size:12.5px;color:var(--fg-3)} .ov-state.bad{color:var(--bad-fg);font-weight:500}
.ov-none{margin:0;padding:var(--s5) 0;text-align:center;color:var(--fg-2);font-size:13.5px}
.ov-flights{display:flex;flex-direction:column;gap:var(--s4)}
.ov-flights .flight{padding:var(--s5)}


.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);align-items:start}
.widget{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);min-width:0;display:flex;flex-direction:column}
.widget.full{grid-column:1/-1}
.widget-h{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5) var(--s3)}
.widget-h h2{margin:0;font-size:15px;font-weight:600}
.w-link{margin-left:auto;font-size:12.5px;color:var(--fg-2)}
.widget-b{padding:0 var(--s5) var(--s5);min-width:0}
.widget-b .ov-list .ov-item:first-child{border-top:0;padding-top:4px}
.widget-b .ov-list .ov-item:last-child{border-bottom:0;padding-bottom:0}
.widget-b .ov-strip{border:0;grid-template-columns:repeat(4,minmax(0,1fr))}
.widget-b .ov-cell{padding-top:0;padding-bottom:0}
.widget-b .flight.flat{padding:0;gap:var(--s3)}
.widget.half .ov-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.widget.half .ov-cell:nth-child(3){border-left:0;padding-left:0}.widget.half .ov-cell:nth-child(n+3){border-top:1px solid var(--line);padding-top:var(--s3);margin-top:var(--s3)}
.ov-state.warn{color:var(--warn-fg);font-weight:500}
@media (max-width:1080px){.dash{grid-template-columns:minmax(0,1fr)}.widget.full{grid-column:auto}.widget-b .ov-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.widget-b .ov-cell:nth-child(3){border-left:0;padding-left:0}.widget-b .ov-cell:nth-child(n+3){border-top:1px solid var(--line);padding-top:var(--s3);margin-top:var(--s3)}}
@media (max-width:700px){.widget-b .ov-cell+.ov-cell{padding-left:var(--s3)}.widget-b .ov-cell:nth-child(2){border-top:0;margin-top:0;padding-top:0;border-left:1px solid var(--line)}.widget-b .ov-cell:nth-child(3){padding-left:0}.widget-b .ov-v{font-size:21px}.widget-b .ov-n{white-space:normal}.widget-h,.widget-b{padding-left:var(--s4);padding-right:var(--s4)}}
@media (max-width:700px){.ov-strip{grid-template-columns:minmax(0,1fr)}.ov-cell,.ov-cell+.ov-cell{padding:var(--s3) 0;border-left:0}.ov-cell+.ov-cell{border-top:1px solid var(--line)}.ov-item{grid-template-columns:auto minmax(0,1fr)}.ov-item-a{grid-column:2}.ov-item-s{white-space:normal}}

/* ---------- Create a service ---------- */
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:var(--s2);flex-wrap:wrap;counter-reset:st}
.stepper li{flex:1 1 0;min-width:0}
.stepper li>*{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;border-top:3px solid var(--line);background:transparent;font:inherit;text-align:left;color:var(--fg-3)}
.stepper li.done>*{border-top-color:var(--fg-2);color:var(--fg-2)}
.stepper li.current>*{border-top-color:var(--ember);color:var(--fg)}
.stepper button{cursor:pointer}

function ovStats(){

  return '<div class="stats">'+cell(D.services.length,"Services in the catalog")+cell(today.length,"Deploys today")+

    cell(D.envs.filter(function(e){return e.kind==="preview";}).length,"Preview environments live")+'</div>';

/* Needs attention: a broken environment, a deploy that failed, a preview about to expire. */
function ovNeeds(){
  var out=[];
  D.services.forEach(function(s){ENVS.forEach(function(env){var st=s.env[env][3];
    if(st!=="failing"&&st!=="degraded")return;
    out.push([st==="failing"?"bad":"warn",'<span class="mono">'+s.name+'</span> is '+st+' in '+env,
      catIssue(s)||"Deployed "+s.env[env][1].toLowerCase()+" by "+esc(s.env[env][2]),
      '<a class="btn btn-sm" href="#service-'+s.name+'">Open</a>']);});});

function catRank(s){var p=s.env.production[3],st=s.env.staging[3];return p==="failing"?0:st==="failing"?1:p==="degraded"?2:st==="degraded"?3:p==="none"?5:4;}
function catHot(s){var p=s.env.production[3],st=s.env.staging[3];return p==="failing"||st==="failing"?"bad":p==="degraded"||st==="degraded"?"warn":"";}
function catAhead(s){var a=s.env.staging[0],b=s.env.production[0];return a!=="—"&&b!=="—"&&a!==b&&s.env.staging[3]==="healthy";}
function catIssue(s){
  var bad=["production","staging"].filter(function(e){var x=s.env[e][3];return x==="failing"||x==="degraded";});
  if(!bad.length)return "";
  var d=D.deploys.filter(function(d){return d.svc===s.name&&d.state==="failed"&&d.note;})[0];
  return (bad[0]==="production"?"Production":"Staging")+" is "+s.env[bad[0]][3]+(d?". "+d.note:"");

function catRows(){
  var q=ui.catQuery.toLowerCase();

    var okT=ui.catTeam==="all"||s.team===ui.catTeam;
    var okS=ui.catStatus==="all"||(ui.catStatus==="attention"?!!catHot(s):ui.catStatus==="ahead"?catAhead(s):!catHot(s)&&s.env.production[3]!=="none");
    return okQ&&okT&&okS;}).sort(function(a,b){return catRank(a)-catRank(b)||a.name.localeCompare(b.name);});

/* ---------------- Create a service: step by step ---------------- */
var CR_STEPS=[["tpl","Template"],["basics","Name and owner"],["inputs","Template inputs"],["run","How it runs"],["review","Review"]];
var CR_TEAMS=["platform-engineering","billing","commerce","risk","growth","discovery","mobile"];
var CR_ACCESS=[
  ["public","Public","Staging and production both get a public HTTPS address."],
  ["internal-staging","Internal staging","Production is public. Staging is reachable only inside the cluster, over HTTP."],
  ["internal","Internal","No public address. Both environments are reachable only inside the cluster, over HTTP."]];
var CR;
function crReset(tpl){
  CR={step:tpl?1:0,max:tpl?1:0,tpl:tpl||"go-grpc",name:"",team:"",access:"public",inputs:{},errors:{},
    run:{replicas:"2",auto:false,min:"2",max:"6",cpuTarget:"70",cpu:"250m",mem:"256Mi",env:[],secrets:[],crons:[]}};
  crDefaults();
}
function crDefaults(){CR.inputs={};(tplOf(CR.tpl).params||[]).forEach(function(p){CR.inputs[p.key]=p.type==="bool"?!!p.def:(p.def||"");});}
function crName(){return CR.name||"<name>";}
function crAddr(env){
  var internal=CR.access==="internal"||(CR.access==="internal-staging"&&env==="staging");
  return internal?"http://"+crName()+"."+env+".svc.cluster.local":"https://"+crName()+"."+env+NIP;
}
function crCli(){
  var t=tplOf(CR.tpl),r=CR.run,a=['forge create '+crName(),'--template '+CR.tpl,'--team '+(CR.team||"<team>")];
  if(CR.access==="internal")a.push("--internal");
  if(CR.access==="internal-staging")a.push("--internal-staging");
  (t.params||[]).forEach(function(p){var v=CR.inputs[p.key];if(p.required||String(v)!==String(p.def===undefined?"":p.def))if(v!==""&&v!==undefined)a.push("--set "+p.key+"="+v);});
  if(r.replicas!=="2")a.push("--replicas "+r.replicas);
  if(r.auto)a.push("--autoscale "+r.min+"-"+r.max+"@"+r.cpuTarget+"%");
  if(r.cpu!=="250m"||r.mem!=="256Mi")a.push("--resources cpu="+r.cpu+",memory="+r.mem);
  r.env.forEach(function(e){if(e[0])a.push("--env "+e[0]+"="+e[1]);});
  r.secrets.forEach(function(e){if(e[0])a.push("--secret "+e[0]+"="+e[1]);});
  r.crons.forEach(function(e){if(e[0])a.push('--cron "'+e[0]+'='+e[1]+'"');});
  return a;
}
function crCliHtml(){var a=crCli();return '<span class="p">$</span> '+esc(a[0])+a.slice(1).map(function(x){var i=x.indexOf(" ");return ' \\\n    <span class="f">'+esc(x.slice(0,i))+'</span>'+esc(x.slice(i));}).join("");}
function crYaml(){
  var t=tplOf(CR.tpl),r=CR.run,y=["name: "+crName(),"team: "+(CR.team||"<team>"),"template: "+t.name+"@"+t.ver];
  var ins=(t.params||[]).filter(function(p){return CR.inputs[p.key]!==""&&CR.inputs[p.key]!==undefined;});
  if(ins.length){y.push("inputs:");ins.forEach(function(p){y.push("  "+p.key+": "+CR.inputs[p.key]);});}
  y.push("run:");
  if(CR.access==="internal")y.push("  domain: internal");
  if(CR.access==="internal-staging")y.push("  staging:","    public: false");
  y.push("  replicas: "+r.replicas);
  if(r.auto)y.push("  autoscaling:","    min: "+r.min,"    max: "+r.max,"    cpu: "+r.cpuTarget+"%");
  y.push("  resources:","    cpu: "+r.cpu,"    memory: "+r.mem);
  var env=r.env.filter(function(e){return e[0];}),sec=r.secrets.filter(function(e){return e[0];}),cr=r.crons.filter(function(e){return e[0];});
  if(env.length){y.push("  env:");env.forEach(function(e){y.push("    "+e[0]+": \""+e[1]+"\"");});}
  if(sec.length){y.push("  secrets:");sec.forEach(function(e){y.push("    "+e[0]+": "+e[1]);});}
  if(cr.length){y.push("  cron:");cr.forEach(function(e){y.push("    - name: "+e[0],"      schedule: \""+e[1]+"\"","      command: "+e[2]);});}
  return y.join("\n");
}
function crErr(id){var m=CR.errors[id];return '<span class="field-err" id="'+id+'-err" role="status">'+(m?esc(m):"")+'</span>';}
function crInv(id){return CR.errors[id]?' aria-invalid="true"':'';}

  return '<input class="input'+(o.mono?" mono":"")+'" id="'+id+'" data-cr="'+path+'" value="'+esc(val)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.num?' type="number" min="'+(o.min||1)+'" inputmode="numeric"':'')+' autocomplete="off" spellcheck="false" aria-describedby="'+id+'-err"'+crInv(id)+(o.label?' aria-label="'+esc(o.label)+'"':'')+'>';}

function crStepTpl(){

    '</div><div class="addr-prev" id="cw-addr"></div><span class="hint">Change it later in forge.yaml (run.domain and run.staging.public).</span></fieldset></div>';

function crAddrHtml(){return ENVS.map(function(e){return '<div><span class="faint">'+e+'</span><span class="mono">'+esc(crAddr(e))+'</span></div>';}).join("");}
function crStepInputs(){
  var t=tplOf(CR.tpl),ps=t.params||[];
  if(!ps.length)return '<div class="cw-empty"><b><span class="mono">'+t.name+'</span> has no inputs.</b><p class="muted">Nothing to fill in here. Continue to choose how it runs.</p></div>';
  var f=function(p){var id="cw-p-"+p.key,v=CR.inputs[p.key];
    if(p.type==="bool")return '<label class="check"><input type="checkbox" id="'+id+'" data-cr="inputs.'+p.key+'"'+(v?" checked":"")+'><span>'+esc(p.label)+(p.hint?'<br><span class="faint" style="font-size:12.5px">'+esc(p.hint)+'</span>':'')+'</span></label>';
    var ctl=p.type==="select"?crSelect(id,"inputs."+p.key,v,p.options):crInput(id,"inputs."+p.key,v,{mono:p.type!=="number",num:p.type==="number",ph:p.ph});

function crRows(kind,cols){

    '<div><button type="button" class="btn btn-sm" data-action="cw-add" data-kind="'+kind+'">'+I.plus+'Add</button></div></div>';

function crStepRun(){

function goldenGaps(){return D.services.filter(function(s){return s.tier&&s.tier<=1&&s.checks&&sum(s.checks)<5;});}
function unowned(){return D.resources.filter(function(r){return !r.svc;});}
function coverage(){var total=D.services.length+D.resources.length;var owned=D.services.filter(function(s){return s.team;}).length+D.resources.filter(function(r){return r.svc;}).length;return {owned:owned,total:total,pct:Math.round(owned/total*100)};}
function ruleHits(r){
  if(r.id==="golden-path")return goldenGaps().length;
  if(r.id==="owner-required")return unowned().length;
  return r.hits||0;
}

  if(id==="cat-q"){ui.catQuery=e.target.value;render();var c=document.getElementById("cat-q");c.focus();c.setSelectionRange(c.value.length,c.value.length);}
  else if(id==="doc-q"){ui.docQuery=e.target.value;render();var dq=document.getElementById("doc-q");dq.focus();dq.setSelectionRange(dq.value.length,dq.value.length);}
  else if(id==="audit-q"){ui.auditQuery=e.target.value;render();var q=document.getElementById("audit-q");q.focus();q.setSelectionRange(q.value.length,q.value.length);}
  else if(id==="pal-in")palFilter(e.target.value);
  else if(id==="ho-new"||id==="ho-confirm"){hostCheck();}
  else if(id==="dsv-in"){document.getElementById("dsv-go").disabled=e.target.value!==document.getElementById("dsv-go").dataset.svc;}
  else if(id==="ds-in"){document.getElementById("ds-go").disabled=e.target.value!==document.getElementById("ds-go").dataset.env;}
  else if(id&&id.indexOf("cr-")===0){e.target.removeAttribute("aria-invalid");var fe=document.getElementById(id+"-err");if(fe)fe.textContent="";updateCreate();}
});
document.addEventListener("change",function(e){var tg=e.target;
  if((tg.id&&tg.id.indexOf("ac-")===0)||tg.name==="ac-kind"||tg.name==="ac-strategy"){if(tg.id==="ac-stg"||tg.id==="ac-prd")acErr("ac-envs","");acUpdate();return;}
  if(tg.dataset&&tg.dataset.notif){var np=tg.dataset.notif.split(".");ME.notif[np[0]][np[1]]=tg.checked;return;}
  if(tg.id==="me-quiet"){ME.quiet=tg.checked;document.getElementById("me-quiet-times").hidden=!tg.checked;return;}
  if(tg.id==="tk-exp"){document.getElementById("tk-exp-h").textContent=tg.value==="0"?"A token that never expires is risky if it leaks. Rules may flag it.":"";return;}if(CR&&e.target.name==="cw-tpl"){CR.tpl=e.target.value;crDefaults();CR.max=Math.min(CR.max,1);crRender();var r=document.querySelector('input[name="cw-tpl"]:checked');if(r)r.focus();return;}if(CR&&e.target.name==="cw-access"){CR.access=e.target.value;crLive();return;}if(CR&&e.target.dataset&&e.target.dataset.cr){var t=e.target;crSet(t.dataset.cr,t.type==="checkbox"?t.checked:t.value);if(CR.errors[t.id]){delete CR.errors[t.id];t.removeAttribute("aria-invalid");var fe=document.getElementById(t.id+"-err");if(fe)fe.textContent="";}crLive();return;}if(e.target.id==="ho-env"||e.target.id==="ho-dnsok"){hostCheck();return;}if(e.target.id==="doc-sel"){ui.docPage=+e.target.value;render();window.scrollTo(0,0);return;}if(e.target.id&&e.target.id.indexOf("cr-")===0)updateCreate();});
document.addEventListener("submit",function(e){e.preventDefault();if(e.target.id==="cw-form"){var g=document.getElementById("cw-go");if(g)g.click();}});
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(document.getElementById("pal-in"))closeLayer();else openPalette();return;}
  if(e.key==="Escape"&&layer.innerHTML){closeLayer();return;}
  if(e.key==="Escape"&&app.classList.contains("nav-open")){app.classList.remove("nav-open");return;}
  if(document.getElementById("pal-in")&&palItems.length){
    if(e.key==="ArrowDown"){e.preventDefault();palSel=(palSel+1)%palItems.length;drawPal();}
    else if(e.key==="ArrowUp"){e.preventDefault();palSel=(palSel-1+palItems.length)%palItems.length;drawPal();}
    else if(e.key==="Enter"){e.preventDefault();var it=palItems[palSel];closeLayer();location.hash=it.href;}
  }
});
render();
})();
</script>
