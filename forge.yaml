# Forge service manifest. See 'forge init --help'.
apiVersion: forge.dev/v1
service:
  name: forge-web
  team: platform-engineering
  owners:
    - deogratias.saidi@outlook.com
  lifecycle: experimental
  repo: https://github.com/showmino/forge-web
run:
  port: 3000
  health: /api/healthz
  # The dashboard is "forge", not "forge-web", to the people who open it:
  # forge.<domain> in production, forge-staging.<domain> in staging.
  host: forge
# The pages of docs/, in the order the dashboard shows them.
docs:
  - path: index.md
    title: Overview
  - path: using.md
  - path: writing-docs.md
  - path: architecture.md
  - path: security.md
  - path: development.md
  - path: runbook.md
