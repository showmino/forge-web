# Forge service manifest. See 'forge init --help'.
apiVersion: forge.dev/v1
service:
  name: forge-web
  team: platform-engineering
  owners:
    - deogratias.saidi@outlook.com
  lifecycle: experimental
  repo: https://github.com/showmino/forge-web
run:
  port: 3000
  health: /api/healthz
  # This service is forge-web's staging only: forge-web-staging.<domain>.
  # Production is the forge chart's dashboard (forge.<domain>, web.image.tag),
  # so this service is never promoted.
  host: forge-web
  # The Forge API the pages call, from a browser: showmino's own. Another
  # Forge runs the same image with its own address here.
  env:
    FORGE_API_URL: https://forge-api.showmino.com
# The pages of docs/, in the order the dashboard shows them.
docs:
  - path: index.md
    title: Overview
  - path: using.md
  - path: writing-docs.md
  - path: architecture.md
  - path: security.md
  - path: development.md
  - path: runbook.md
