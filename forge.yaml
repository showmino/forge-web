# Forge service manifest. See 'forge init --help'.
apiVersion: forge.dev/v1
service:
  name: forge-web
  team: platform-engineering
  owners:
    - deogratias.saidi@outlook.com
  lifecycle: experimental
  repo: https://github.com/showmino/forge-web
run:
  port: 3000
  health: /api/healthz
  # The dashboard stays on its internal address until the Forge API and
  # the login have public HTTPS names too: a page served over HTTPS may
  # not call an API over HTTP.
  domain: none
